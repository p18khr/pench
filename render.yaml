# render.yaml — Pench Safari
# Do NOT put secrets here. Set env vars in Render Dashboard.
# Keepalive is handled by UptimeRobot pinging /__health every 5 minutes.

services:
  - type: web
    name: pench-safari
    env: node
    plan: starter
    region: oregon
    buildCommand: cd server && npm install && npm run build
    startCommand: node server/server.js
